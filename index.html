<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mermaid Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<style>
  body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
  #header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #ccc; }
  #header button, #header select { padding: 6px 10px; }
  #main { flex: 1; display: flex; min-height: 0; }
  #workspace { flex: 0 0 65%; min-width: 0; display: flex; min-height: 0; }
  #phoneWorkspace { flex: 1 1 35%; min-width: 0; min-height: 0; padding: 12px; box-sizing: border-box; border-left: 1px solid #ccc; display: flex; background: #fafafa; }
  #drawer { display: flex; height: 100%; border-right: 1px solid #ccc; }
  #drawer.closed { border-right: none; }
  #editor { display: flex; flex-direction: column; width: 320px; height: 100%; }
  #code { /* width: 320px; height: 100%; */ flex: 1; width: 100%; box-sizing: border-box; padding: 12px; font-family: monospace; font-size: 14px; border: none; resize: none; }
  /* #drawer.closed #code { display: none; } */
  #drawer.closed #editor { display: none; }
  #errorLog { display: none; }
  #errorLog.open { display: block; height: 25%; overflow: auto; margin: 0; padding: 8px 12px; box-sizing: border-box; border-top: 1px solid #ccc; color: red; white-space: pre-wrap; font: 12px/1.4 monospace; }
  #drawerToggle { width: 24px; border: none; border-left: 1px solid #ccc; background: #f5f5f5; cursor: pointer; }
  #drawer.closed #drawerToggle { border-left: none; }
  #output { flex: 1; min-width: 0; height: 100%; overflow: auto; padding: 12px; box-sizing: border-box; }
  #phoneOutput { position: relative; flex: 1; min-width: 0; min-height: 0; border: 8px solid #333; border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; background: #fff; }
  #phoneDiagram { flex: 1; min-height: 0; overflow: auto; }
  #phoneOutput svg { max-width: none !important; }
  #diagram svg { max-width: none !important; }
  #phoneBar { display: flex; gap: 8px; padding: 8px 12px; border-bottom: 2px solid #888; box-shadow: 0 2px 6px rgba(0,0,0,0.25); position: relative; z-index: 1; flex: none; }
  #logBox { display: none; }
  #logBox.open { display: block; position: absolute; left: 0; right: 0; bottom: 0; top: 45%; margin: 0; padding: 16px; overflow: auto; background: #fff; white-space: pre-wrap; font: 14px/1.5 system-ui, sans-serif; border-top: 2px solid #333; box-shadow: 0 -4px 12px rgba(0,0,0,.15); z-index: 1; }
  #error { color: red; white-space: pre-wrap; padding: 12px; }
  #status { font-size: 12px; color: #666; padding: 0 12px; }
  #phoneDiagram .node[id*="_Y-"], #phoneDiagram .node[id*="_N-"], #phoneDiagram .node[id*="_ONCE-"], #phoneDiagram .node[id*="_NONE-"], #phoneDiagram .node[id*="_MULTIPLE-"] { cursor: pointer; }
  #diagram .dim { opacity: 0.15; }
  #nodeActions { display: none; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid #ccc; }
  /* #nodeActions.open { display: flex; } */
  #nodeActions .removal-only { display: none; }
  #nodeActions.removing .removal-only { display: inline-block; }
  #diagram g.node.editor-selected rect, #diagram g.node.editor-selected path, #diagram g.node.editor-selected polygon { stroke: #1565c0 !important; stroke-width: 4px !important; }
  #diagram g.node.editor-preview rect, #diagram g.node.editor-preview path, #diagram g.node.editor-preview polygon { stroke: #ef6c00 !important; stroke-width: 4px !important; stroke-dasharray: 6 4; }
  /* #diagram .nodeLabel[contenteditable="true"] { outline: 2px solid #1565c0; background: #fff; } */
  #nodeInspector { position: fixed; z-index: 20; box-sizing: border-box; width: 320px; padding: 12px 16px 16px; background: #fff; border: 1px solid #ddd; border-radius: 22px; box-shadow: 0 4px 16px rgba(0,0,0,0.25); font-family: monospace; }
  #nodeInspector h2 { margin: 0 0 12px; font-size: 16px; font-weight: normal; text-align: center; }
  .inspector-text-row { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
  .inspector-text-row input { flex: 1; min-width: 0; padding: 6px 8px; border: 2px solid #555; border-radius: 4px; font: inherit; }
  .inspector-grid:not([hidden]) { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .inspector-grid button { padding: 6px 10px; }
  .inspector-destination-row:not([hidden]) { display: flex; align-items: center; gap: 6px; }
  .inspector-destination-row select { flex: 1; min-width: 0; padding: 6px 8px; font: inherit; }
  .span-2 { grid-column: 1 / -1; }
</style>
</head>
<body>
<div id="header">
  <button id="newBtn">New</button>
  <button id="saveBtn">Save</button>
  <button id="openFileBtn">Open file...</button>
  <input type="file" id="openFileInput" accept=".mmd,text/plain" style="display:none">
  <button id="resetBtn">Reset</button>
  <button id="editorUndoBtn">Undo edit</button>
  <button id="editorRedoBtn">Redo edit</button>
  <button id="previousDecisionBtn">Previous</button>
  <button id="nextDecisionBtn">Next</button>
  <span id="decisionCounter" aria-live="polite">0 / 0</span>
  <select id="diagramSelect">
    <option value="" disabled selected>Diagrams</option>
  </select>
  <div id="status"></div>
</div>
<div id="main">
  <div id="workspace">
    <div id="drawer" class="closed">
      <div id="editor">
        <textarea id="code">flowchart TD
  B_NEW[New idea]</textarea>
        <pre id="errorLog"></pre>
      </div>
      <button id="drawerToggle" title="Show/hide editor">&#9776;</button>
    </div>
    <div id="nodeActions" aria-live="polite">
      <span id="selectedNode"></span>
      <button id="addQuestionAfterBtn">Add question after</button>
      <button id="addBlockAfterBtn">Add block after</button>
      <button id="removeQuestionBtn">Remove question</button>
      <button id="removeBlockBtn">Remove block</button>
      <button id="addChoiceBtn">Add choice</button>
      <button id="removeChoiceBtn">Remove choice</button>
    <!-- <button id="nextRemovalPathBtn" class="removal-only">Next replacement path</button> -->
    <!-- <button id="confirmRemoveQuestionBtn" class="removal-only">Confirm removal</button> -->
    <!-- <button id="cancelRemoveQuestionBtn" class="removal-only">Cancel removal</button> -->
    <!-- <button id="editorUndoBtn">Undo edit</button> -->
    <!-- <button id="editorRedoBtn">Redo edit</button> -->
    </div>
    <div id="output">
      <div id="diagram"></div>
      <div id="error"></div>
    </div>
  </div>
  <div id="phoneWorkspace">
    <div id="phoneOutput">
    <div id="phoneBar">
      <button id="undoBtn">Undo decision</button>
      <button id="logBtn">Log</button>
    </div>
    <div id="phoneDiagram"></div>
    <pre id="logBox"></pre>
    </div>
  </div>
</div>
<aside id="nodeInspector" role="dialog" aria-labelledby="nodeInspectorTitle" hidden>
  <h2 id="nodeInspectorTitle"></h2>
  <label class="inspector-text-row"><span>Text:</span><input id="nodeTextInput" type="text"></label>
  <label id="nodeTypeRow" class="inspector-text-row"><span>Category:</span><input id="nodeTypeInput" type="text" list="nodeTypeOptions"></label>
  <datalist id="nodeTypeOptions">
    <option value="static"></option>
    <option value="goal"></option>
  </datalist>
  <label id="nodeTypeColorRow" class="inspector-text-row"><span>Color:</span><input id="nodeTypeColorInput" type="color"></label>
  <div id="nodeInspectorActions" class="inspector-grid"></div>
  <div id="nodeInspectorControls" class="inspector-grid">
    <button id="nodeInspectorDismissBtn" class="span-2">Cancel</button>
    <label id="destinationRow" class="inspector-destination-row span-2"><span>Destination:</span><select id="destinationSelect"></select></label>
  </div>
  <div id="nodeInspectorRemovalPreview" class="inspector-grid" hidden>
    <button id="nextRemovalPathBtn">Next replacement path</button>
    <button id="confirmRemoveQuestionBtn">Confirm removal</button>
    <button id="cancelRemoveQuestionBtn" class="span-2">Cancel removal</button>
  </div>
</aside>

<script src="viewer.js"></script>
</body>
</html>
