<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mermaid Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<style>
  body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
  #header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #ccc; }
  #header button, #header select { padding: 6px 10px; }
  #main { flex: 1; display: flex; min-height: 0; }
  #drawer { display: flex; height: 100%; border-right: 1px solid #ccc; }
  #drawer.closed { border-right: none; }
  #code { width: 320px; height: 100%; box-sizing: border-box; padding: 12px; font-family: monospace; font-size: 14px; border: none; resize: none; }
  #drawer.closed #code { display: none; }
  #drawerToggle { width: 24px; border: none; border-left: 1px solid #ccc; background: #f5f5f5; cursor: pointer; }
  #drawer.closed #drawerToggle { border-left: none; }
  #output { flex: 1; height: 100%; overflow: auto; padding: 12px; box-sizing: border-box; }
  #output.phone { flex: none; width: 375px; height: 600px; margin: 16px auto; border: 12px solid #333; border-radius: 30px; overflow: hidden; }
  #output.phone #diagram { height: 100%; }
  #output.phone svg { width: 100% !important; height: 100% !important; max-width: none !important; }
  #output.phone #error:empty { padding: 0; }
  #undoBtn { display: none; }
  #output.phone { position: relative; }
  #output.phone #undoBtn { display: block; position: absolute; top: 12px; left: 12px; /* bottom: 12px; left: 50%; transform: translateX(-50%); */ }
  #error { color: red; white-space: pre-wrap; padding: 12px; }
  #status { font-size: 12px; color: #666; padding: 0 12px; }
  #diagram .node[id*="_Y-"], #diagram .node[id*="_N-"], #diagram .node[id*="_ONCE-"], #diagram .node[id*="_NONE-"], #diagram .node[id*="_MULTIPLE-"] { cursor: pointer; }
  #diagram .dim { opacity: 0.15; }
</style>
</head>
<body>
<div id="header">
  <button id="newBtn">New</button>
  <button id="saveBtn">Save</button>
  <button id="openFileBtn">Open file...</button>
  <input type="file" id="openFileInput" accept=".mmd,text/plain" style="display:none">
  <button id="resetBtn">Reset</button>
  <label><input type="checkbox" id="phoneToggle"> Phone view</label>
  <select id="diagramSelect">
    <option value="" disabled selected>Diagrams</option>
  </select>
  <div id="status"></div>
</div>
<div id="main">
  <div id="drawer" class="closed">
    <textarea id="code">flowchart TD
  A[New idea]</textarea>
    <button id="drawerToggle" title="Show/hide editor">&#9776;</button>
  </div>
  <div id="output">
    <div id="diagram"></div>
    <div id="error"></div>
    <button id="undoBtn">Undo decision</button>
  </div>
</div>

<script>
  mermaid.initialize({ startOnLoad: false });
  const codeBox = document.getElementById('code');
  const diagramBox = document.getElementById('diagram');
  const errorBox = document.getElementById('error');
  const statusBox = document.getElementById('status');
  const selectBox = document.getElementById('diagramSelect');
  const drawer = document.getElementById('drawer');
  const drawerToggle = document.getElementById('drawerToggle');
  const openFileBtn = document.getElementById('openFileBtn');
  const openFileInput = document.getElementById('openFileInput');
  const outputBox = document.getElementById('output');
  const phoneToggle = document.getElementById('phoneToggle');
  let renderId = 0;
  let currentName = null;
  let watcher = null;
  const chosenAnswers = new Set();
  const phonePath = []; // decision node ids clicked in phone view, in order

  function parentOf(id, edges) {
    return edges.find(([, to]) => to === id)[0];
  }

  function sliceIds(edges) {
    const last = phonePath[phonePath.length - 1];
    const ids = last ? [parentOf(last, edges), last] : [edges[0][0]];
    let node = ids[ids.length - 1];
    for (;;) {
      const next = edges.filter(([from]) => from === node).map(([, to]) => to);
      if (next.length === 0) return ids;
      if (next.length > 1) return ids.concat(next);
      node = next[0];
      ids.push(node);
    }
  }

  function stubIds(ids, edges) {
    return ids
      .flatMap(id => isAnswerId(id, edges) ? edges.filter(([from]) => from === id).map(([, to]) => to) : [])
      .filter(to => !ids.includes(to));
  }

  function topStubIds(ids, edges, leadIns) {
    if (!phonePath.length) return [];
    const visible = new Set([...ids, ...leadIns]);
    const targets = [ids[0], ...leadIns];
    return [...new Set(edges.filter(([, to]) => targets.includes(to)).map(([from]) => from).filter(from => !visible.has(from)))];
  }

  function leadInIds(ids, edges) {
    if (!phonePath.length) return [];
    const found = [];
    const queue = [...ids];
    while (queue.length) {
      const node = queue.shift();
      for (const [from] of edges.filter(([, to]) => to === node)) {
        const isStatic = !isAnswerId(from, edges) && edges.filter(([f]) => f === from).length <= 1;
        if (!isStatic || ids.includes(from) || found.includes(from)) continue;
        found.push(from);
        queue.push(from);
      }
    }
    return found;
  }

  function siblingIds(ids, edges) {
    if (!phonePath.length) return [];
    return edges.filter(([from, to]) => from === ids[0] && to !== ids[1]).map(([, to]) => to);
  }

  function sliceSource(ids, stubs, topStubs, siblings, leadIns, bottomQ) {
    const visible = new Set([...ids, ...leadIns]);
    const keep = new Set([...ids, ...stubs, ...topStubs, ...siblings, ...leadIns]);
    const top = new Set(topStubs);
    const allStubs = [...stubs, ...topStubs];
    const stubSet = new Set(allStubs);
    const idOf = (line) => line.split(/[\[{(\s]/)[0];
    const lines = [];
    for (const raw of codeBox.value.split('\n')) {
      const line = raw.trim();
      if (line.startsWith('flowchart') || line.startsWith('classDef')) lines.push(line);
      else if (line.startsWith('class ')) {
        const [, list, name] = line.split(' ');
        const kept = list.split(',').filter(id => visible.has(id));
        if (kept.length) lines.push(`class ${kept.join(',')} ${name}`);
      } else if (line.includes('-->')) {
        const chain = line.split('-->').map(s => s.trim());
        for (let i = 0; i + 1 < chain.length; i++) {
          const a = chain[i], b = chain[i + 1];
          if ((visible.has(a) && keep.has(b)) || (top.has(a) && visible.has(b)))
            lines.push(stubs.includes(b) ? `${a} -.-> ${b}` : `${a} --> ${b}`);
        }
      } else if (keep.has(idOf(line)) && !stubSet.has(idOf(line))) lines.push(line);
    }
    for (const sibling of siblings) lines.push(`${ids[0]} -.-> ${sibling}`);
    for (const id of allStubs) lines.push(`${id}[" "]`);
    if (allStubs.length) {
      lines.push('classDef stub fill:transparent,stroke:transparent,color:transparent');
      lines.push(`class ${allStubs.join(',')} stub`);
    }
    if (siblings.length) {
      lines.push('classDef unchosen fill:#eee,stroke:#bbb,color:#999');
      lines.push(`class ${siblings.join(',')} unchosen`);
    }
    return lines.join('\n');
  }

  function parseEdges(text) {
    const edges = [];
    for (const rawLine of text.split('\n')) {
      const line = rawLine.trim();
      if (line.startsWith('%%') || !line.includes('-->')) continue;
      const ids = line.split('-->').map(s => s.trim());
      for (let i = 0; i + 1 < ids.length; i++) edges.push([ids[i], ids[i + 1]]);
    }
    return edges;
  }

  function walkTrail(edges) {
    const bright = new Set();
    const visited = new Set();
    let node = edges[0][0];
    while (node && !visited.has(node)) {
      visited.add(node);
      bright.add(node);
      const nextNodes = edges.filter(([from]) => from === node).map(([, to]) => to);
      if (nextNodes.length <= 1) {
        node = nextNodes[0];
        continue;
      }
      node = nextNodes.find(option => chosenAnswers.has(option));
      if (!node) for (const option of nextNodes) bright.add(option);
    }
    return bright;
  }

  function highlightPath() {
    const svgNodes = diagramBox.querySelectorAll('g.node');
    const svgEdges = diagramBox.querySelectorAll('path.flowchart-link');
    const edges = parseEdges(codeBox.value);
    const bright = chosenAnswers.size ? walkTrail(edges) : null;
    const isDim = (id) => bright !== null && !bright.has(id);
    for (const el of svgNodes) el.classList.toggle('dim', isDim(nodeIdOf(el)));
    for (const el of svgEdges) {
      const [from, to] = edgeEndsOf(el, edges);
      el.classList.toggle('dim', isDim(from) || isDim(to));
    }
  }

  function edgeEndsOf(el, edges) {
    return edges.find(([from, to]) => el.id.includes('L_' + from + '_' + to + '_')) || [];
  }

  function nodeIdOf(el) {
    return el.id.replace(/^.*flowchart-/, '').replace(/-\d+$/, '');
  }

  function isAnswerId(id, edges) {
    return edges.some(([from, to]) => to === id && from.startsWith('Q_') && id.startsWith(from + '_'));
  }

  function scrollToNextQuestion(edges) {
    const bright = [...walkTrail(edges)];
    const nextQuestion = bright.reverse().find((id) => id.startsWith('Q_') && !isAnswerId(id, edges));
    if (!nextQuestion) return;
    const el = diagramBox.querySelector('[id*="flowchart-' + nextQuestion + '-"]');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  outputBox.addEventListener('click', (event) => {
    const nodeEl = event.target.closest('g.node');
    if (!nodeEl) {
      chosenAnswers.clear();
      highlightPath();
      return;
    }
    const clicked = nodeIdOf(nodeEl);
    const edges = parseEdges(codeBox.value);
    if (!isAnswerId(clicked, edges)) return;
    if (phoneToggle.checked) {
      const last = phonePath[phonePath.length - 1];
      if (last && parentOf(clicked, edges) === parentOf(last, edges)) phonePath.pop();
      phonePath.push(clicked);
      render();
      return;
    }
    if (chosenAnswers.has(clicked)) chosenAnswers.delete(clicked);
    else chosenAnswers.add(clicked);
    highlightPath();
    // if (phoneToggle.checked && chosenAnswers.size) scrollToNextQuestion(edges);
  });

  // function updateSvgSizingForPhoneMode() {
  //   const svg = diagramBox.querySelector('svg');
  //   if (!svg) return;
  //   if (!outputBox.classList.contains('phone')) {
  //     svg.style.width = '';
  //     svg.style.height = '';
  //     return;
  //   }
  //   const viewBox = svg.getAttribute('viewBox');
  //   if (!viewBox) return;
  //   const [, , vbWidth, vbHeight] = viewBox.split(' ').map(Number);
  //   svg.style.width = vbWidth + 'px';
  //   svg.style.height = vbHeight + 'px';
  // }

  // function drawSeparator(ids) {
  //   if (!phonePath.length || ids.length < 3) return;
  //   const svg = diagramBox.querySelector('svg');
  //   const nodeEl = (id) => diagramBox.querySelector('[id*="flowchart-' + id + '-"]');
  //   const yOf = (el) => Number(el.getAttribute('transform').match(/translate\([^,]+,\s*([^)]+)\)/)[1]);
  //   const chosen = nodeEl(ids[1]);
  //   const next = nodeEl(ids[2]);
  //   const chosenBottom = yOf(chosen) + chosen.getBBox().height / 2;
  //   const nextTop = yOf(next) - next.getBBox().height / 2;
  //   const [x, , width] = svg.getAttribute('viewBox').split(' ').map(Number);
  //   const y = (chosenBottom + nextTop) / 2;
  //   const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  //   line.setAttribute('x1', x); line.setAttribute('x2', x + width);
  //   line.setAttribute('y1', y); line.setAttribute('y2', y);
  //   line.setAttribute('stroke', '#888'); line.setAttribute('stroke-width', '2'); line.setAttribute('stroke-dasharray', '8 6');
  //   line.setAttribute('class', 'separator');
  //   svg.appendChild(line);
  // }

  function drawSeparatorBetween(topId, belowIds) {
    const svg = diagramBox.querySelector('svg');
    const nodeEl = (id) => diagramBox.querySelector('[id*="flowchart-' + id + '-"]');
    const yOf = (el) => Number(el.getAttribute('transform').match(/translate\([^,]+,\s*([^)]+)\)/)[1]);
    const top = nodeEl(topId);
    const belowEls = belowIds.map(nodeEl).filter(Boolean);
    if (!top || !belowEls.length) return;
    const topBottom = yOf(top) + top.getBBox().height / 2;
    const belowTop = Math.min(...belowEls.map(el => yOf(el) - el.getBBox().height / 2));
    const [x, , width] = svg.getAttribute('viewBox').split(' ').map(Number);
    const y = (topBottom + belowTop) / 2;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x); line.setAttribute('x2', x + width);
    line.setAttribute('y1', y); line.setAttribute('y2', y);
    line.setAttribute('stroke', '#888'); line.setAttribute('stroke-width', '2'); line.setAttribute('stroke-dasharray', '8 6');
    line.setAttribute('class', 'separator');
    svg.appendChild(line);
  }

  async function render() {
    const id = 'diagram-' + (renderId++);
    errorBox.textContent = '';
    try {
      const edges = parseEdges(codeBox.value);
      const phone = phoneToggle.checked && edges.length > 0;
      const ids = phone ? sliceIds(edges) : [];
      const leadIns = leadInIds(ids, edges);
      const siblings = siblingIds(ids, edges);
      const topStubs = topStubIds(ids, edges, leadIns).filter(id => !siblings.includes(id));
      const bottomQ = [...ids].reverse().find(id => edges.filter(([from]) => from === id).length > 1);
      const source = phone ? sliceSource(ids, stubIds(ids, edges), topStubs, siblings, leadIns, bottomQ) : codeBox.value;
      const { svg } = await mermaid.render(id, source);
      diagramBox.innerHTML = svg;
      if (phone && phonePath.length && ids.length > 2) drawSeparatorBetween(ids[1], [ids[2]]);
      if (phone && bottomQ) drawSeparatorBetween(bottomQ, edges.filter(([from]) => from === bottomQ).map(([, to]) => to));
      if (!phone) highlightPath();
      // updateSvgSizingForPhoneMode();
    } catch (err) {
      errorBox.textContent = err.message;
    }
  }

  function setStatus(text) {
    statusBox.textContent = text;
    setTimeout(() => { if (statusBox.textContent === text) statusBox.textContent = ''; }, 2000);
  }

  function setDrawerOpen(open) {
    drawer.classList.toggle('closed', !open);
  }

  async function loadList() {
    const names = await fetch('/api/diagrams').then(r => r.json());
    selectBox.innerHTML = '<option value="" disabled ' + (currentName ? '' : 'selected') + '>Diagrams</option>';
    for (const name of names) {
      const option = document.createElement('option');
      option.value = name;
      option.textContent = name;
      if (name === currentName) option.selected = true;
      selectBox.appendChild(option);
    }
  }

  async function loadDiagram(name) {
    const text = await fetch('/api/diagrams/' + encodeURIComponent(name)).then(r => r.text());
    currentName = name;
    codeBox.value = text;
    render();
    loadList();
    watchDiagram(name);
  }

  function watchDiagram(name) {
    if (watcher) watcher.close();
    watcher = new EventSource('/api/watch/' + encodeURIComponent(name));
    watcher.onmessage = async () => {
      codeBox.value = await fetch('/api/diagrams/' + encodeURIComponent(name)).then(r => r.text());
      render();
    };
  }

  async function saveDiagram() {
    let name = currentName;
    if (!name) {
      name = prompt('Name this diagram (letters, numbers, - and _ only):');
      if (!name) return;
      if (!name.endsWith('.mmd')) name += '.mmd';
    }
    await fetch('/api/diagrams/' + encodeURIComponent(name), {
      method: 'PUT',
      body: codeBox.value,
    });
    currentName = name;
    setStatus('Saved ' + name);
    loadList();
    watchDiagram(name);
  }

  document.getElementById('newBtn').addEventListener('click', () => {
    if (watcher) watcher.close();
    currentName = null;
    codeBox.value = 'flowchart TD\n  A[New idea]';
    render();
    loadList();
    setDrawerOpen(true);
  });
  document.getElementById('saveBtn').addEventListener('click', saveDiagram);
  document.getElementById('resetBtn').addEventListener('click', () => {
    chosenAnswers.clear();
    phonePath.length = 0;
    highlightPath();
    render();
    outputBox.scrollTo({ top: 0, behavior: 'smooth' });
  });
  document.getElementById('undoBtn').addEventListener('click', (event) => {
    event.stopPropagation();
    phonePath.pop();
    render();
  });
  drawerToggle.addEventListener('click', () => setDrawerOpen(drawer.classList.contains('closed')));
  selectBox.addEventListener('change', () => loadDiagram(selectBox.value));
  phoneToggle.addEventListener('change', () => {
    outputBox.classList.toggle('phone', phoneToggle.checked);
    render();
  });

  openFileBtn.addEventListener('click', () => openFileInput.click());
  openFileInput.addEventListener('change', async () => {
    const file = openFileInput.files[0];
    if (!file) return;
    if (watcher) watcher.close();
    currentName = null;
    codeBox.value = await file.text();
    selectBox.value = '';
    render();
    loadList();
    setDrawerOpen(true);
    openFileInput.value = '';
  });

  codeBox.addEventListener('input', render);
  // render();
  // loadList();
  loadDiagram('accountability.mmd');
</script>
</body>
</html>
